# Keeps the SHA-pinned actions in .github/workflows current. The "github"
# prefix makes subjects like "github: bump ..." that lint-commits accepts.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: github
