name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pull from these caches in every job; the check job also pushes what it
# builds to jylhis-extra (cachix-action, below).
env:
  NIX_CONFIG: |
    extra-substituters = https://jylhis-extra.cachix.org https://cache.numtide.com https://devenv.cachix.org https://nix-community.cachix.org
    extra-trusted-public-keys = jylhis-extra.cachix.org-1:fG6wVx1e7AaS7vodJoR+0Lk2nhISY3NzGDMAZ2veXKk= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

# A new push to a branch supersedes its running check. The pull_request run
# and the run update.yml dispatches on the same update/<name> branch share a
# group, so only one of them keeps going. Each push to main gets its own
# group: GitHub keeps one pending run per group and cancels the rest, which
# would leave main commits without a status.
concurrency:
  group: check-${{ github.event_name == 'push' && github.sha || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - run: nix fmt -- --ci

  # nixpkgs' commit rules; only a pull request has a base to compare with.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - env:
          BASE: ${{ github.base_ref }}
        run: nix run .#lint-commits -- "origin/$BASE"

  # NUR's evaluation of nur.nix, against the nixpkgs NUR itself uses. NUR
  # keeps the last revision that passed, so a failure here would otherwise
  # go unnoticed.
  nur-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - run: |
          nixpkgs=$(nix-instantiate --find-file nixpkgs -I nixpkgs=channel:nixos-unstable)
          nix run .#nur-eval -- -nixpkgs "$nixpkgs"

  # Evaluates every flake output on both systems without building: the
  # output shape checks of nix flake check that the check job's
  # nix-fast-build skips (modules, overlays, apps, devShells, formatter).
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - run: nix flake check --no-build --all-systems

  # x86_64-linux only: aarch64-linux is evaluated by the eval job, not built.
  check:
    needs: format
    timeout-minutes: 150
    runs-on: ubuntu-latest
    steps:
      # The full check set doesn't fit the runner's root disk. Pool the free
      # space of / and its second disk at /mnt, after deleting preinstalled
      # toolchains, into one volume at /nix, with swap beside it for the big
      # C++ and Next.js builds (langfuse). It has to run before Nix is
      # installed.
      - uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c # v10
        with:
          build-mount-path: /nix
          root-reserve-mb: 4096
          swap-size-mb: 8192
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
      - run: |
          free -h
          df -h
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A multi-user install: nix-eval-jobs from nixpkgs links a newer Nix
      # than the runner's, and without a daemon it waits forever for an
      # exclusive store lock to migrate the database. It also enables KVM.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          # One build at a time, so two heavy builds never share the memory.
          # Build directories go on the /nix volume too, not /tmp on /.
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            max-jobs = 1
            build-dir = /nix/build
      # Pushes everything this job builds. Without the secret (pull requests
      # from forks) it only pulls. nvidia-cli is an unfree binary NVIDIA
      # doesn't let us redistribute, so it and its source stay out.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: jylhis-extra
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: nvidia-cli
      # Builds only the checks whose outputs no substituter has yet, without
      # downloading the cached ones: a change to one package builds that
      # package, its tests and whatever depends on it, plus the lints that
      # read the whole tree. A change to flake.lock or a shared file still
      # rebuilds everything it reaches, because the hashes change.
      # nix-eval-jobs starts one worker per core by default, and with 4 GB
      # each, workers die under memory pressure; two keep eval near a minute.
      - name: Build uncached checks
        run: |
          nix run --inputs-from . nixpkgs#nix-fast-build -- \
            --flake ".#checks.x86_64-linux" \
            --skip-cached --no-nom --max-jobs 1 \
            --eval-workers 2 --eval-max-memory-size 2048 \
            --result-file results.xml --result-format junit
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-x86_64-linux
          path: results.xml
          if-no-files-found: ignore

  # The one required status check: a stable name whatever the jobs above
  # are called. commits is skipped outside pull requests.
  ci-ok:
    needs: [format, commits, nur-eval, eval, check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          jq -e 'all(. == "success" or . == "skipped")' <<<"$RESULTS"
