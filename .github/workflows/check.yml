name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pull from these caches in every job; the check job also pushes what it
# builds to jylhis-extra (cachix-action, below).
env:
  NIX_CONFIG: |
    extra-substituters = https://jylhis-extra.cachix.org https://cache.numtide.com https://devenv.cachix.org https://nix-community.cachix.org
    extra-trusted-public-keys = jylhis-extra.cachix.org-1:fG6wVx1e7AaS7vodJoR+0Lk2nhISY3NzGDMAZ2veXKk= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

# A new push to a pull request supersedes its running check; runs on main
# always finish.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - run: nix fmt -- --ci

  # nixpkgs' commit rules; only a pull request has a base to compare with.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - env:
          BASE: ${{ github.base_ref }}
        run: nix run .#lint-commits -- "origin/$BASE"

  check:
    needs: format
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.os }}
    steps:
      # The full check set doesn't fit the runner's free disk. Pool the free
      # space of / and /mnt, plus preinstalled toolchains it deletes, into
      # one volume at /nix; it has to run before Nix is installed. Waits for
      # the deletions so a big build can't start before the space is there,
      # and spares 10G of / for the swap file below.
      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
        with:
          witness-carnage: true
          root-safe-haven: 10240
          nix-permission-edict: true
      # Big C++ and Next.js builds (onnxruntime-vitisai, langfuse) ran the
      # runner out of memory and killed the job; swap rides out the peaks.
      - name: Add swap
        run: |
          sudo fallocate -l 8G /swapfile-nix
          sudo chmod 600 /swapfile-nix
          sudo mkswap /swapfile-nix
          sudo swapon /swapfile-nix
          free -h
          df -h / /nix
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          # One build at a time, so two heavy builds never share the memory.
          # Build directories go on the /nix volume too, not /tmp on /.
          nix_conf: |
            system-features = nixos-test benchmark big-parallel kvm
            max-jobs = 1
            build-dir = /nix/build
      # Pushes everything this job builds. Without the secret (pull requests
      # from forks) it only pulls. nvidia-cli is an unfree binary NVIDIA
      # doesn't let us redistribute, so it and its source stay out.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: jylhis-extra
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: nvidia-cli
      - name: Enable KVM
        if: matrix.system == 'x86_64-linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: nix flake check
        run: nix flake check --keep-going --print-build-logs --system ${{ matrix.system }}

  # The one required status check: a stable name whatever the jobs above
  # are called. commits is skipped outside pull requests.
  ci-ok:
    needs: [format, commits, check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          jq -e 'all(. == "success" or . == "skipped")' <<<"$RESULTS"
