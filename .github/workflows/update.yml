name: update

# Bumps every package that sets passthru.updateScript (nix-update-script)
# with `nix run .#update` (scripts/update.nix), one pull request per
# package. The update job also dispatches check on the
# PR branch, so the PR's head commit gets a status even where opening the PR
# triggers no pull_request run. Where it does trigger one, check.yml's
# concurrency group cancels the duplicate.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      packages:
        description: Space-separated packages to update (empty for all)
        required: false
        default: ""

permissions:
  contents: read

# The same caches as check.yml; the update job also pushes the bumped
# package's build to jylhis-extra.
env:
  NIX_CONFIG: |
    extra-substituters = https://jylhis-extra.cachix.org https://cache.numtide.com https://devenv.cachix.org https://nix-community.cachix.org
    extra-trusted-public-keys = jylhis-extra.cachix.org-1:fG6wVx1e7AaS7vodJoR+0Lk2nhISY3NzGDMAZ2veXKk= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

# The scheduled and a manual run would push the same update/<name> branches.
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - id: list
        env:
          ONLY: ${{ inputs.packages }}
        run: |
          # shellcheck disable=SC2086 # ONLY is a list of names
          echo "packages=$(nix run .#update -- --list $ONLY)" >> "$GITHUB_OUTPUT"

  update:
    needs: discover
    if: needs.discover.outputs.packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: write # dispatches check on the PR branch
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      # create-pull-request pushes with its own token input, so the build
      # below never sees a credential in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      # nvidia-cli stays out of the public cache, as in check.yml.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: jylhis-extra
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: nvidia-cli
      - name: nix-update
        id: update
        env:
          NAME: ${{ matrix.package }}
        run: |
          echo "old=$(nix eval --raw ".#$NAME.version")" >> "$GITHUB_OUTPUT"
          nix run .#update -- "$NAME"
          echo "version=$(nix eval --raw ".#$NAME.version")" >> "$GITHUB_OUTPUT"
      - id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: update/${{ matrix.package }}
          delete-branch: true
          commit-message: "${{ matrix.package }}: ${{ steps.update.outputs.old }} -> ${{ steps.update.outputs.version }}"
          title: "${{ matrix.package }}: ${{ steps.update.outputs.old }} -> ${{ steps.update.outputs.version }}"
          body: Automated update by nix-update.
          labels: dependencies,automated
      - name: Dispatch check
        # pull-request-head-sha is set even when there was nothing to commit.
        if: contains(fromJSON('["created", "updated"]'), steps.pr.outputs.pull-request-operation)
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ matrix.package }}
        run: gh workflow run check.yml --repo "$GITHUB_REPOSITORY" --ref "update/$NAME"
