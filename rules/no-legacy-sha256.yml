# Adapted from numtide/llm-agents.nix (MIT), rev 177efbe, rules/no-legacy-sha256.yml.
id: no-legacy-sha256
language: nix
severity: error
message: >-
  Use `hash = "sha256-..."` (SRI format) instead of the legacy `sha256`/`cargoSha256`/`vendorSha256` attributes. All fetchers and builders in this repo accept `hash`.
rule:
  kind: binding
  has:
    field: attrpath
    regex: '^(sha256|cargoSha256|vendorSha256)$'
  not:
    inside:
      kind: apply_expression
      stopBy: end
      regex: '^builtins\.fetchTarball'
