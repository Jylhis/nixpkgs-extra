id: prefer-finalattrs
language: nix
severity: error
message: >-
  Use `(finalAttrs: { ... })` instead of `rec { ... }` for a derivation. `rec`
  freezes values at definition time, so overrideAttrs can't change what other
  attributes derive from them.
rule:
  kind: rec_attrset_expression
  inside:
    kind: apply_expression
    field: argument
    has:
      field: function
      regex: '(mkDerivation|buildPythonPackage|buildPythonApplication|buildGoModule|buildRustPackage|buildNpmPackage)$'
